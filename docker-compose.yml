# PiHound Frontend Standalone Docker Compose Configuration
# Usage:
#   docker compose up --build -d
#   docker compose logs -f


services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pihound_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
