<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>PiHound — Pi Network Analytics &amp; Explorer</title>
    <meta name="title" content="PiHound — Pi Network Analytics &amp; Explorer" />
    <meta
      name="description"
      content="Deep analytics toolkit for the Pi Network — live price charts, wallet explorer, transaction tracing, exchange reserves, and real-time sweep monitoring."
    />
    <meta
      name="keywords"
      content="Pi Network, Pi Network Explorer, Pi Network Analytics, Pi Wallet Lookup, Pi Transaction Trace, Pi Sweeps, Pi Mainnet, Pi Crypto, PCT Balances, Pi Core Team, Blockchain Explorer, Web3 Analytics"
    />
    <meta name="author" content="PiHound Team" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://pihound.com/" />
    <meta name="theme-color" content="#090d16" />
    <meta name="application-name" content="PiHound" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/webp" href="/images/favicon.webp" />
    <link rel="shortcut icon" type="image/webp" href="/images/favicon.webp" />
    <link rel="apple-touch-icon" href="/images/icon.webp" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / Discord / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pihound.com/" />
    <meta property="og:site_name" content="PiHound" />
    <meta property="og:title" content="PiHound — Pi Network Analytics &amp; Explorer" />
    <meta
      property="og:description"
      content="Deep analytics toolkit for the Pi Network — live price charts, wallet explorer, transaction tracing, exchange reserves, and real-time sweep monitoring."
    />
    <meta property="og:image" content="https://pihound.com/images/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://pihound.com/images/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:alt" content="PiHound — Advanced Pi Network Analytics and Explorer Platform" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@pihoundofficial" />
    <meta name="twitter:creator" content="@pihoundofficial" />
    <meta name="twitter:url" content="https://pihound.com/" />
    <meta name="twitter:title" content="PiHound — Pi Network Analytics &amp; Explorer" />
    <meta
      name="twitter:description"
      content="Deep analytics toolkit for the Pi Network — live price charts, wallet explorer, transaction tracing, exchange reserves, and real-time sweep monitoring."
    />
    <meta name="twitter:image" content="https://pihound.com/images/og-image.jpg" />
    <meta name="twitter:image:alt" content="PiHound — Advanced Pi Network Analytics and Explorer Platform" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://pihound.com/#website",
            "url": "https://pihound.com/",
            "name": "PiHound",
            "description": "Deep analytics toolkit and explorer for the Pi Network.",
            "potentialAction": [
              {
                "@type": "SearchAction",
                "target": {
                  "@type": "EntryPoint",
                  "urlTemplate": "https://pihound.com/wallet_explorer?account={search_term_string}"
                },
                "query-input": "required name=search_term_string"
              }
            ],
            "inLanguage": "en-US"
          },
          {
            "@type": "Organization",
            "@id": "https://pihound.com/#organization",
            "name": "PiHound",
            "url": "https://pihound.com/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://pihound.com/images/icon.webp"
            },
            "sameAs": [
              "https://x.com/pihoundofficial",
              "https://github.com/PIHound-Lab",
              "https://t.me/pihound"
            ]
          },
          {
            "@type": "WebApplication",
            "@id": "https://pihound.com/#webapp",
            "url": "https://pihound.com/",
            "name": "PiHound Analytics & Explorer",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "All",
            "browserRequirements": "Requires JavaScript. Requires HTML5.",
            "description": "Real-time analytics, blockchain explorer, fund flow tracking, and wallet sweep monitoring for Pi Network.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          }
        ]
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="google_translate_element" style="display: none;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
